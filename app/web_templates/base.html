<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>{% block title %}PCA Generator{% endblock %}</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root { --brand: #111827; --accent: #2563eb; }
  body { font-family: 'Inter', system-ui, sans-serif; }
  .btn-primary { background: var(--accent); color: white; padding: 10px 18px; border-radius: 8px; font-weight: 500; transition: opacity .15s; }
  .btn-primary:hover { opacity: .9; }
  .btn-primary:disabled { opacity: .4; cursor: not-allowed; }
  .btn-ghost { padding: 10px 18px; border-radius: 8px; font-weight: 500; color: #374151; }
  .btn-ghost:hover { background: #f3f4f6; }
  .card { background: white; border-radius: 12px; border: 1px solid #e5e7eb; }
  .step-dot { width: 24px; height: 24px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600; }
  .step-dot.done { background: #10b981; color: white; }
  .step-dot.active { background: var(--accent); color: white; }
  .step-dot.pending { background: #e5e7eb; color: #6b7280; }
  .drop-zone { border: 2px dashed #d1d5db; transition: all .15s; }
  .drop-zone.dragover { border-color: var(--accent); background: #eff6ff; }
  .section-chip { border: 1px solid #e5e7eb; border-radius: 8px; padding: 12px; cursor: pointer; transition: all .15s; }
  .section-chip:hover { border-color: #9ca3af; }
  .section-chip.selected { border-color: var(--accent); background: #eff6ff; }
  .section-chip.required { background: #f9fafb; cursor: not-allowed; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .spinner { animation: spin 1s linear infinite; }
</style>
</head>
<body class="bg-gray-50 min-h-screen">

<nav class="bg-white border-b border-gray-200">
  <div class="max-w-5xl mx-auto px-6 py-3 flex items-center justify-between">
    <a href="/app" class="font-semibold text-gray-900">PCA Generator</a>
    {% if user %}
    <div class="flex items-center gap-4">
      <a href="/app" class="text-sm text-gray-600 hover:text-gray-900">New PCA</a>
      <a href="/history" class="text-sm text-gray-600 hover:text-gray-900">History</a>
      <div class="flex items-center gap-2 ml-2">
        {% if user.picture %}<img src="{{ user.picture }}" class="w-7 h-7 rounded-full" />{% endif %}
        <span class="text-sm text-gray-700">{{ user.name or user.email }}</span>
      </div>
      <a href="/logout" class="text-sm text-gray-500 hover:text-gray-700">Sign out</a>
    </div>
    {% else %}
    <div>
      <a href="/web" class="text-sm text-gray-600 hover:text-gray-900">Sign in</a>
    </div>
    {% endif %}
  </div>
</nav>

<main class="max-w-5xl mx-auto px-6 py-8">
  {% block content %}{% endblock %}
</main>

</body>
</html>
